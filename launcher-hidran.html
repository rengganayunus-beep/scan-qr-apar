<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sistem Inspeksi Hidran Pusdiklat</title>

<!-- Ikon asli - sama alasannya dengan launcher.html (APAR): sistem Apps Script dibungkus
     iframe sandbox Google, jadi ikon custom tidak pernah kebaca Safari kalau ditaruh di
     halaman Apps Script itu sendiri. Di sini, sebagai halaman statis biasa, ikon ini
     otomatis kebaca normal oleh iOS/Android. -->
<link rel="apple-touch-icon" href="https://drive.google.com/thumbnail?id=191rxyfvCxmGpoZQLk6KDXH-8Tybi9geh&sz=w400">
<link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=191rxyfvCxmGpoZQLk6KDXH-8Tybi9geh&sz=w400">
<meta name="theme-color" content="#0a4595">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inspeksi Hidran">

<!-- Alihkan langsung (bukan dibingkai iframe) - lebih sederhana & tidak kena masalah
     tata letak seperti percobaan iframe di launcher.html APAR. Mode "standalone" di HP
     tidak menampilkan address bar, jadi pengalihan ini tidak akan terlihat pengguna. -->
<meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbxX1ZDvquKX9ZRzt885vaiqaV7M0UaCn-6iG1ag4ER1sBFsim_V8Vq5UqdXrnO7PC8TIA/exec">

<style>
  :root{--primary:#0a4595;--primary-dark:#073169;--accent:#ffb800}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
       background:linear-gradient(160deg,var(--primary),var(--primary-dark));color:#fff;
       display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
       text-align:center;padding:24px}
  img{width:72px;height:72px;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.01em}
  p{font-size:13px;margin:0;opacity:.85;max-width:260px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
</style>
</head>
<body>
  <img src="https://drive.google.com/thumbnail?id=191rxyfvCxmGpoZQLk6KDXH-8Tybi9geh&sz=w400" alt="Ikon Hidran">
  <h1>Sistem Inspeksi Hidran Pusdiklat</h1>
  <p>Membuka aplikasi&hellip;</p>
  <div class="dot"></div>

  <script>
    window.location.replace("https://script.google.com/macros/s/AKfycbxX1ZDvquKX9ZRzt885vaiqaV7M0UaCn-6iG1ag4ER1sBFsim_V8Vq5UqdXrnO7PC8TIA/exec");
  </script>
</body>
</html>
